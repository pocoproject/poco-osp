# Manifest
bundle.name      = OSP Command Shell Service
bundle.vendor    = Applied Informatics
bundle.copyright = (c) 2009-2026, Applied Informatics Software Engineering GmbH

# The TCP interface and port, on which the Shell service is running
interface = localhost
port = 22023

# The maximum number of simultaneous connections
maxConnections = 4

# The time in seconds after which a session without a command is closed
sessionTimeout = 600

# The time in seconds for which stopping the shell waits for its sessions to end
stopTimeout = 10

# The name of the auth service to use.
# Set to empty name to disable authentication/authorization.
authServiceName = osp.auth

# Internal resources
greeting    = ${bundle.name} ready.\nCopyright ${bundle.copyright}.\nEnter "h" or "help" for a list of commands.
help.header = The following commands are available:
help.footer = Enter "help <command>" or "<command> --help" for more information about a command.

login.description = Authenticate the current user with a username and password.
login.usage = [--help] username credentials

quit.description = Exit the shell.
quit.usage = [--help]
