# Internal resources
bundles.description = List all installed bundles in the system. A pattern can be specified to list only bundles matching the given pattern.
bundles.usage = [--help] [pattern ...]

services.description = List all registered services in the system. A pattern can be specified to list only services matching the given pattern.
services.usage = [--help] [pattern ...]

start.description = Start a bundle. The bundle can be specified by its ID or its symbolic name.
start.usage = [--help] bundle ...

stop.description = Stop a bundle. The bundle can be specified by its ID or its symbolic name.
stop.usage = [--help] [--force] [--all] bundle ...

resolve.description = Resolve a bundle. The bundle can be specified by its ID or its symbolic name.
resolve.usage = [--help] bundle ...

uninstall.description = Uninstall a bundle. The bundle can be specified by its ID or its symbolic name.
uninstall.usage = [--help] bundle ...

info.description = Display information about a bundle.
info.usage = [--help] [--dependencies | --clients] bundle ...

install.description = Download and install a new bundle from the given URI.
install.usage = [--help] uri ...

upgrade.description = Download an upgrade to a bundle and install it. The bundle can be specified by its ID or its symbolic name.
upgrade.usage = [--help] bundle uri
