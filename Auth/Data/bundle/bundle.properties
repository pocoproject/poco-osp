#
# Misc. params
#

# Cache size for permissions cache
auth.cacheSize = 1024

# Cache timeout (seconds) for password cache
auth.cacheTimeout = 600

# The salt for hashing user passwords
auth.passwordSalt = 39de6c947f74f99c425fb8061a54fc6b

# Use V2 hashes (PBKDF2 with HMAC-SHA1 and random per-user salt)
auth.hashVersion = 4

# The length of user-specific salt strings for V2 and V3 hashes
auth.saltLength = 7

# The number of PBKDF2 iterations
auth.pbkdf2Rounds = 1024


#
# Table names
#

auth.table.user = auth_user
auth.table.user_permissions = auth_user_permissions
auth.table.role_permissions = auth_role_permissions
auth.table.role = auth_role
auth.table.user_roles = auth_user_roles
auth.table.user_attributes = auth_user_attributes
auth.table.role_attributes = auth_role_attributes
auth.table.role_mappings = auth_role_mappings

#
# SQL features
#

auth.sql.features.ODBC.autoCommit = false

#
# SQL queries
#

# If using SQLite, we need foreign keys support for cascaded deletes
auth.sql.init.SQLite = PRAGMA foreign_keys = ON

auth.sql.init.MySQL = 

# The query to verify database connectivity.
# Should return value >= 0 if successful.
auth.sql.checkConnectivity = \
	SELECT COUNT(*) \
		FROM ${auth.table.user}

# The query to discover inline attributes.
auth.sql.discoverInlineAttributes = \
	SELECT * \
		FROM ${auth.table.user}

# The query to verify that a user exists.
# Parameter is username, result is integer (0 - does not exist, not 0 - exists).
auth.sql.userExists = \
	SELECT COUNT(*) \
		FROM ${auth.table.user} \
		WHERE username = ?

# The query to obtain the password hash.
# Parameter is username, result is password hash.
auth.sql.passwordHashForUser = \
	SELECT password \
		FROM ${auth.table.user} \
		WHERE username = ?

# The statement executed in order to change a password.
# Parameters are hashed password and username.
auth.sql.changePassword = \
	UPDATE ${auth.table.user} \
		SET password = ? \
		WHERE username = ?

# The query returning the permissions directly assigned
# to the user.
# Parameter is the username.
auth.sql.permissionsForUser = \
	SELECT permission \
		FROM ${auth.table.user_permissions} \
		WHERE username = ?

# The query returning all permissions assigned to the user,
# directly and via assigned roles.
# Parameter is the username (given three times).
auth.sql.effectivePermissionsForUser = \
	SELECT ${auth.table.role_permissions}.permission \
		FROM ${auth.table.user}, ${auth.table.user_roles}, ${auth.table.role_permissions} \
		WHERE ${auth.table.user}.username = ${auth.table.user_roles}.username \
		  AND ${auth.table.user_roles}.rolename = ${auth.table.role_permissions}.rolename \
		  AND ${auth.table.user}.username = ? \
	UNION \
	${auth.sql.permissionsForUser} \
	UNION \
	SELECT rp.permission \
		FROM ${auth.table.role_mappings} rm, ${auth.table.role_permissions} rp, ${auth.table.user_roles} ur \
		WHERE ur.username = ? \
		  AND ur.rolename = rm.external_role \
		  AND rm.internal_role = rp.rolename

# The statement to grant a permission to an user.
# Paramters are username and permission.
auth.sql.grantPermissionToUser = \
	INSERT INTO ${auth.table.user_permissions} \
		VALUES (?, ?)

# The statement to revoke a permission from an user.
# Parameters are username and permission.
auth.sql.revokePermissionFromUser = \
	DELETE FROM ${auth.table.user_permissions} \
		WHERE username = ? \
		  AND permission = ?

# The statement to revoke a permission from all users
# Parameter is permission.
auth.sql.revokePermissionFromUsers = \
	DELETE FROM ${auth.table.user_permissions} \
		WHERE permission = ?;

# The statement to revoke a permission from all roles
# Parameter is permission.
auth.sql.revokePermissionFromRoles = \
	DELETE FROM ${auth.table.role_permissions} \
		WHERE permission = ?;

# The query returning all usernames in the database.
auth.sql.users = \
	SELECT username \
		FROM ${auth.table.user} \
		ORDER BY username

# The query returning all usernames in the database matching a given pattern.
# Parameter is pattern for SQL LIKE operator.
auth.sql.usersWithName = \
	SELECT username \
		FROM ${auth.table.user} \
		WHERE username LIKE ? \
		ORDER BY username

# The query returning all usernames in the database having the given permission.
# Parameter is permission.
auth.sql.usersWithPermission = \
	SELECT username \
		FROM ${auth.table.user_permissions} \
		WHERE permission = ? \
		ORDER BY username

# The query returning all usernames in the database having the given role.
# Parameter is rolename.
auth.sql.usersWithRole = \
	SELECT username \
		FROM ${auth.table.user_roles} \
		WHERE rolename = ? \
		ORDER BY username

# The query returning all usernames in the database having the given external attribute.
# Parameters are attribute name and value.
auth.sql.usersWithAttribute = \
	SELECT username \
		FROM ${auth.table.user_attributes} \
		WHERE attribute = ? AND value = ? \
		ORDER BY username

# The query returning all usernames in the database having the given inline attribute.
# Parameters are attribute name and value.
auth.sql.usersWithInlineAttribute = \
	SELECT username \
		FROM ${auth.table.user} \
		WHERE "%s" = ? \
		ORDER BY username

# The statement to add a user to the database.
# Parameters are username and hashed password.
auth.sql.addUser = \
	INSERT INTO ${auth.table.user} (username, password) \
		VALUES (?, ?)

# The statement to remove a user from the database.
# Parameter is the username.
auth.sql.removeUser = \
	DELETE FROM ${auth.table.user} \
		WHERE username = ?

# The statement to remove a user's permissions from the database.
# Parameter is the username.
auth.sql.removeUserPermissions = \
	DELETE FROM ${auth.table.user_permissions} \
		WHERE username = ?

# The statement to remove a user's roles from the database.
# Parameter is the username.
auth.sql.removeUserRoles = \
	DELETE FROM ${auth.table.user_roles} \
		WHERE username = ?

# The statement to remove a user's attributes from the database.
# Parameter is the username.
auth.sql.removeUserAttributes = \
	DELETE FROM ${auth.table.user_attributes} \
		WHERE username = ?

# The query returning all permissions granted to a role.
# Parameter is the rolename.
auth.sql.permissionsForRole = \
	SELECT permission \
		FROM ${auth.table.role_permissions} \
		WHERE rolename = ?

# The statement to grant a permission to a role.
# Paramters are rolename and permission.
auth.sql.grantPermissionToRole = \
	INSERT INTO ${auth.table.role_permissions} \
		VALUES (?, ?)

# The statement to revoke a permission from a role.
# Parameters are rolename and permission.
auth.sql.revokePermissionFromRole = \
	DELETE FROM ${auth.table.role_permissions} \
		WHERE rolename = ? \
		  AND permission = ?

# The statement to removes all permissions from a role.
# Parameter is rolename.
auth.sql.removePermissionsFromRole = \
	DELETE FROM ${auth.table.role_permissions} \
		WHERE rolename = ?

# The query to verify that a role exists.
# Parameter is rolename, result is integer (0 - does not exist, not 0 - exists).
auth.sql.roleExists = \
	SELECT COUNT(*) \
		FROM ${auth.table.role} \
		WHERE rolename = ?

# The query returning all roles in the database.
auth.sql.roles = \
	SELECT rolename \
		FROM ${auth.table.role}

# The statement to add a role to the database.
# Parameter is the rolename.
auth.sql.addRole = \
	INSERT INTO ${auth.table.role} \
		VALUES (?)

# The statement to remove a role from the database.
# Parameter is the rolename.
auth.sql.removeRole = \
	DELETE FROM ${auth.table.role} \
		WHERE rolename = ?

# The query returning all permissions granted to a role.
# Parameter is the rolename.
auth.sql.authorizeRole = \
	SELECT COUNT(*) \
		FROM ${auth.table.role_permissions} \
		WHERE rolename = ? \
		AND permission = ?

# The query returning all roles of a user.
# Parameter is the username.
auth.sql.rolesForUser = \
	SELECT rolename \
		FROM ${auth.table.user_roles} \
		WHERE username = ?

# The statement to assign a role to an user.
# Parameters are username and rolename.
auth.sql.assignRoleToUser = \
	INSERT INTO ${auth.table.user_roles} \
		VALUES(?, ?)

# The statement to remove a role from an user.
# Parameters are username and rolename.
auth.sql.removeRoleFromUser = \
	DELETE FROM ${auth.table.user_roles} \
		WHERE username = ? \
		  AND rolename = ?

# The statement to remove all permissions from an user.
# Parameter is username.
auth.sql.removePermissionsFromUser = \
	DELETE FROM ${auth.table.user_permissions} \
	    WHERE username = ?

# The statement to remove all roles from an user.
# Parameter is username.
auth.sql.removeRolesFromUser = \
	DELETE FROM ${auth.table.user_roles} \
		WHERE username = ?

# The query returning a specific attribute value.
# Parameter is the username and attribute.
auth.sql.getUserAttribute = \
	SELECT value \
		FROM ${auth.table.user_attributes} \
		WHERE username = ? \
		  AND attribute = ?

# The query returning a specific inline attribute value.
# Parameter is the username and attribute.
auth.sql.getInlineUserAttribute = \
	SELECT "%s" \
		FROM ${auth.table.user} \
		WHERE username = ?

# The query returning a specific attribute value.
# Parameter is the rolename and attribute.
auth.sql.getRoleAttribute = \
	SELECT value \
		FROM ${auth.table.role_attributes} \
		WHERE rolename = ? \
		  AND attribute = ?

# The query returning a specific inline attribute value.
# Parameter is the rolename and attribute.
auth.sql.getInlineRoleAttribute = \
	SELECT "%s" \
		FROM ${auth.table.role} \
		WHERE rolename = ?

# The statement for setting (inserting) a user attribute.
# Parameters are username, attribute and value.
auth.sql.setUserAttribute = \
	INSERT INTO ${auth.table.user_attributes} \
		  VALUES (?, ?, ?)

# The statement for setting (inserting) a user attribute.
# Parameters are username, attribute and value.
auth.sql.setInlineUserAttribute = \
	UPDATE ${auth.table.user} \
		  SET "%s" = ? \
		  WHERE username = ?

# The statement for setting (inserting) a role attribute.
# Parameters are rolename, attribute and value.
auth.sql.setRoleAttribute = \
	INSERT INTO ${auth.table.role_attributes} \
		  VALUES (?, ?, ?)

# The statement for setting (inserting) a inline role attribute.
# Parameters are rolename, attribute and value.
auth.sql.setInlineRoleAttribute = \
	UPDATE ${auth.table.role} \
		  SET "%s" = ? \
		  WHERE rolename = ?

# The statement for incrementing a user attribute.
# Parameters are username and attribute.
auth.sql.incInlineUserAttribute = \
	UPDATE ${auth.table.user} \
		  SET "%[0]s" = "%[0]s" + 1 \
		  WHERE username = ?

# The statement for removing a user attribute.
# Parameters are username and attribute.
auth.sql.removeUserAttribute = \
	DELETE FROM ${auth.table.user_attributes} \
		WHERE username = ? and attribute = ?

# The statement for removing a inline user attribute.
# Parameters are username and attribute.
auth.sql.removeInlineUserAttribute = \
	UPDATE ${auth.table.user} \
		SET "%s" = NULL \
		WHERE username = ?

# The statement for removing a role attribute.
# Parameters are rolename and attribute.
auth.sql.removeRoleAttribute = \
	DELETE FROM ${auth.table.role_attributes} \
		WHERE rolename = ? and attribute = ?

# The statement for removing a inline role attribute.
# Parameters are rolename and attribute.
auth.sql.removeInlineRoleAttribute = \
	UPDATE ${auth.table.role} \
		SET "%s" = NULL \
		WHERE rolename = ?

# The statement for removing all user attributes.
# Parameter is username.
auth.sql.removeUserAttributes = \
	DELETE FROM ${auth.table.user_attributes} \
		WHERE username = ? \
		  AND attribute NOT LIKE 'auth_%'

# The statement for removing all user attributes, including auth attributes.
# Parameter is username.
auth.sql.removeAllUserAttributes = \
	DELETE FROM ${auth.table.user_attributes} \
		WHERE username = ?

# The query returning all attribute names for a username.
# Parameter is username.
auth.sql.attributesForUser = \
	SELECT attribute \
		FROM ${auth.table.user_attributes} \
		WHERE username = ? \
		  AND attribute NOT LIKE 'auth_%'

# The query returning all attribute names and values for a username.
# Parameter is username.
auth.sql.attributesValuesForUser = \
	SELECT attribute, value \
		FROM ${auth.table.user_attributes} \
		WHERE username = ?

# The query returning all users for a given attribute value.
# Parameters are attribute name and value.
auth.sql.usersByAttribute = \
	SELECT username \
		FROM ${auth.table.user_attributes} \
		WHERE attribute = ? \
		  AND value = ?

# The query returning all users for a given inline attribute value.
# Parameters are attribute name and value.
auth.sql.usersByInlineAttribute = \
	SELECT username \
		FROM ${auth.table.user} \
		WHERE "%s" = ?

# The query to query inline attributes.
auth.sql.queryInlineAttributes = \
	SELECT * \
		FROM ${auth.table.user} \
		WHERE username = ?

#
# Role mapping queries
#

# The query returning all role mappings.
auth.sql.allRoleMappings = \
	SELECT external_role, internal_role \
		FROM ${auth.table.role_mappings} \
		ORDER BY external_role

# The query returning the internal role for an external role.
# Parameter is the external_role.
auth.sql.roleMappingForExternal = \
	SELECT internal_role \
		FROM ${auth.table.role_mappings} \
		WHERE external_role = ?

# The statement to add or replace a role mapping.
# Parameters are external_role and internal_role.
auth.sql.addRoleMapping = \
	INSERT OR REPLACE INTO ${auth.table.role_mappings} \
		VALUES (?, ?)

# The statement to remove a role mapping.
# Parameter is external_role.
auth.sql.removeRoleMapping = \
	DELETE FROM ${auth.table.role_mappings} \
		WHERE external_role = ?
