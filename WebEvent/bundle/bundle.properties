# The server path and path description for the extension point
path = /webevent
description = Endpoint for WebEvent WebSocket.

# The permission a client needs to open a WebEvent connection. The web
# server checks it on the WebSocket upgrade request, before the connection
# is established; a request without valid credentials is answered with
# 401 Unauthorized, one of a user without the permission with 403 Forbidden.
# "*" admits every authenticated user of an existing account and nobody
# else. A permission name, or a comma-separated list of them (any one of
# which suffices), admits only the users granted it. There is no permission
# per subject: a connection that is admitted may subscribe to every subject
# that the subject authorizer of the service, if one is installed, allows.
# Must not be empty, which would admit unauthenticated connections.
permission = *

# The name of the web session whose cookie authenticates the upgrade
# requests of browsers: the session in which the application's login page
# logs users in. A browser is admitted only once it has logged in to that
# session. Empty: no session login; every client authenticates the upgrade
# request with an Authorization header, HTTP Basic credentials or a bearer
# token if the web server has a token validator (osp.web.tokenValidatorName).
# The global osp.web.authMethods setting limits which of the three apply.
websession.id =
