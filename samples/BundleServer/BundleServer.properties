#
# OSP Configuration
#
osp.codeCache          = ${application.dir}codeCache
osp.bundleRepository   = ${application.configDir}bundles;${application.configDir}../bundles;${application.configDir}../../bundles;
osp.data               = ${application.configDir}data
osp.web.cacheResources = true

#
# Web Server Configuration
#
# The web servers accept connections from this computer only. To accept
# connections from the network, set the addresses to 0.0.0.0 (all
# interfaces) or to the address of one interface.
osp.web.server.host       = 127.0.0.1
osp.web.server.secureHost = 127.0.0.1

#
# WebEvent Configuration
#
# The WebEvent sample page sends notifications to the other clients
# (subject sample.client). The WebEvent service forwards notifications
# from clients only if this is enabled; then any client can notify the
# subscribers of any subject.
osp.web.event.clientNotify = true

#
# Logging Configuration
#
logging.loggers.root.channel = console
logging.loggers.root.level = debug

logging.channels.file.class = FileChannel
logging.channels.file.pattern = %Y-%m-%d %H:%M:%S.%i [%p] %s<%I>: %t
logging.channels.file.path = ${application.dir}${application.baseName}.log
logging.channels.file.rotation = daily
logging.channels.file.archive = number
logging.channels.file.purgeCount = 10

logging.channels.console.class = ColorConsoleChannel
logging.channels.console.pattern = %Y-%m-%d %H:%M:%S.%i [%p] %s<%I>: %t

#
# NetSSL (OpenSSL) Configuration
#
# any.pem contains a certificate for localhost and its private key, for
# testing on this computer only. The private key is publicly known (it
# comes with the POCO samples): replace the file with a certificate and
# a key of your own before the HTTPS server accepts connections from the
# network.
openSSL.server.privateKeyFile = ${application.configDir}any.pem
openSSL.server.verificationMode = none
openSSL.server.verificationDepth = 9
openSSL.server.loadDefaultCAFile = true
openSSL.server.invalidCertificateHandler.name = AcceptCertificateHandler

# Connections to other servers (for example installing a bundle from an
# https URL) accept only certificates that the default CAs have issued.
openSSL.client.invalidCertificateHandler.name = RejectCertificateHandler
openSSL.client.verificationMode = relaxed
openSSL.client.verificationDepth = 9
openSSL.client.loadDefaultCAFile = true
