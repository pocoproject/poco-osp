#
# OSP Configuration
#
osp.codeCache        = ${application.dir}codeCache
osp.bundleRepository = ${application.configDir}bundles;${application.configDir}../bundles;${application.configDir}../../bundles
osp.data             = ${application.configDir}data

#
# Web Server Configuration
#
# The web servers accept connections from this computer only. To accept
# connections from the network, set the addresses to 0.0.0.0 (all
# interfaces) or to the address of one interface.
osp.web.server.host       = 127.0.0.1
osp.web.server.secureHost = 127.0.0.1

#
# Logging Configuration
#
logging.loggers.root.channel  = c1
logging.loggers.root.level = information
logging.formatters.f1.class = PatternFormatter
logging.formatters.f1.pattern = %s: [%p] %t
logging.channels.c1.class = ConsoleChannel
logging.channels.c1.formatter = f1
